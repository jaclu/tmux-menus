#!/usr/bin/env bash
# This is sourced. Fake bang-path to help editors and linters

# Patterns to exclude from linting, anything starting with this will be excluded
excluded_prefixes+=(
    .venv/
    cache/
    scripts/dead_code/
)

command -v pymarkdown >/dev/null && {
    # pymarkdown fails to hancle CHANGELOG.md  "multiple headings"
    excludes+=(
        # If using pymarkdown, some file needs to be excluded
        CHANGELOG.md
        docs/Caching.md
    )
}

_skip='./.git,./.mypy_cache,./cache,./scripts/dead_code,./.venv'

# shellcheck disable=SC2034
override_linter_cmd["codespell"]="codespell -H -S '$_skip'"
# override_linter_cmd["shellcheck"]="shellcheck -a -x -o all -e SC2250,SC2312"
# override_linter_cmd["shellcheck"]="shellcheck -x -o all"
