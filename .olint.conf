#!/usr/bin/env bash
# This is sourced. Fake bang-path to help editors and linters
# shellcheck disable=SC2034 # used by sourcing app

# Patterns to exclude from linting, anything starting with this will be excluded
excluded_prefixes+=(
    .venv/
    cache/
    scripts/dead_code/
)

excludes+=(
    scripts/display_commands.sh # fails bashate
)

_skip='./.git,./.mypy_cache,./cache,./scripts/dead_code,./.venv'
override_linter_cmd["codespell"]="codespell -H -S '$_skip'"

project_linters+=(
    # Markdown heavy projects
    rumdl             # 150/80 depending on rumdl_change_code
    mdlint            # 145/75 depending on mdlint_change_code
    markdownlint-cli2 # 42
    markdownlint      # 42
    pymarkdown        # 42
)
